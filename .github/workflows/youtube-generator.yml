name: Automated YouTube Video Generator

on:
  workflow_dispatch: # Run manually
  schedule:
    - cron: '0 8 * * *' # Run daily at 8 AM UTC

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev pkg-config mecab libmecab-dev mecab-ipadic-utf8

    - name: Install Python Dependencies
      run: |
        # Stage 1: Install base dependencies with pre-built wheels
        pip install -r requirements.txt
        
        # Stage 2: Install MeloTTS without deps (we pre-installed compatible versions)
        pip install git+https://github.com/myshell-ai/MeloTTS.git --no-deps
        
        # Stage 3: Install OpenVoice without deps (avoid broken av==10.*/faster-whisper==0.9.0)
        pip install git+https://github.com/myshell-ai/OpenVoice.git --no-deps

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Create Token File
      # Write the token.json from GitHub Secrets (if secret is empty, file won't be valid JSON)
      # The upload script handles missing/invalid credentials gracefully
      run: |
        if [ -n "$YOUTUBE_TOKEN" ]; then
          echo "$YOUTUBE_TOKEN" > token.json
        fi
      env:
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}

    - name: Generate Audio (MeloTTS + OpenVoice)
      # This step might take time on CPU
      run: python scripts/generate_audio.py

    - name: Record Video (Playwright)
      run: npm run record

    - name: Process Video (Merge)
      run: python scripts/process_video.py

    - name: Upload to YouTube
      # Only attempt upload if credentials exist; script handles gracefully if missing
      run: python scripts/upload.py
      continue-on-error: true

    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: final-video
        path: output/final_video.mp4
        if-no-files-found: warn
