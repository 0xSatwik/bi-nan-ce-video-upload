name: Automated YouTube Video Generator

on:
  workflow_dispatch: # Run manually
  schedule:
    - cron: '0 8 * * *' # Run daily at 8 AM UTC

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        pip install -r youtube/requirements.txt
        # Install ffmpeg for moviepy
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: youtube/package.json

    - name: Install Node Dependencies
      working-directory: youtube
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: youtube
      run: npx playwright install --with-deps chromium

    - name: Create Token File
      # Write the token.json from GitHub Secrets
      run: echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > youtube/token.json

    - name: Generate Audio (MeloTTS + OpenVoice)
      # This step might take time on CPU
      run: python youtube/scripts/generate_audio.py

    - name: Record Video (Playwright)
      # Runs in headless mode (default for CI), might need specific config in script to ensure headful-like rendering 
      # or use xvfb if needed. Playwright handles headless recording well usually.
      working-directory: youtube
      run: npm run record

    - name: Process Video (Merge)
      run: python youtube/scripts/process_video.py

    - name: Upload to YouTube
      run: python youtube/scripts/upload.py

    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: final-video
        path: youtube/output/final_video.mp4
