name: Automated YouTube Video Generator

on:
  workflow_dispatch: # Run manually
  schedule:
    - cron: '0 8 * * *' # Run daily at 8 AM UTC

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt
        # Install ffmpeg for moviepy
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Create Token File
      # Write the token.json from GitHub Secrets (only if secret exists)
      if: ${{ secrets.YOUTUBE_TOKEN_JSON != '' }}
      run: echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json

    - name: Generate Audio (MeloTTS + OpenVoice)
      # This step might take time on CPU
      run: python scripts/generate_audio.py

    - name: Record Video (Playwright)
      run: npm run record

    - name: Process Video (Merge)
      run: python scripts/process_video.py

    - name: Upload to YouTube
      # Only attempt upload if credentials exist; script handles gracefully if missing
      run: python scripts/upload.py
      continue-on-error: true

    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: final-video
        path: output/final_video.mp4
        if-no-files-found: warn
